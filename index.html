<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appli Familiale</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #f4f7f6; --primary: #2c3e50; --accent: #3498db;
            --parent-color: #e3000f; --kids-color: #27ae60;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* En-tête */
        .header { background-color: var(--primary); color: white; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .header button { background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: none; }

        /* ÉCRAN DE CONNEXION */
        #login-screen { padding: 40px 20px; text-align: center; }
        .profiles { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .profile-card { width: 120px; padding: 20px; border-radius: 15px; background: #fff; border: 2px solid #eee; cursor: pointer; transition: 0.3s; }
        .profile-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .profile-card.parent { border-color: var(--parent-color); }
        .profile-card.kid { border-color: var(--kids-color); }
        .avatar { font-size: 3em; margin-bottom: 10px; }

        /* PIN PAD */
        #pin-screen { display: none; text-align: center; padding: 40px 20px; }
        .pin-input { font-size: 2em; letter-spacing: 10px; margin: 20px 0; border: none; border-bottom: 2px solid var(--primary); width: 150px; text-align: center; outline: none; }
        
        /* TABLEAU DE BORD */
        #dashboard-screen { display: none; padding: 20px; }
        .welcome-text { font-size: 1.5em; margin-bottom: 20px; color: var(--primary); }
        .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .widget { padding: 20px; border-radius: 15px; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 130px; transition: transform 0.2s; border: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .widget:active { transform: scale(0.95); }
        .widget .icon { font-size: 2.5em; margin-bottom: 10px; }
        
        .bg-courses { background: linear-gradient(135deg, #e3000f, #ff4757); }
        .bg-school { background: linear-gradient(135deg, #e67e22, #f39c12); }
        .bg-lang { background: linear-gradient(135deg, #3498db, #2980b9); }
        .bg-chess { background: linear-gradient(135deg, #8e44ad, #9b59b6); }

        .app-view { display: none; padding: 20px; }

        /* --- STYLES COURSES --- */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls input, .controls select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-add { background-color: #0050aa; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .main-content { grid-template-columns: 1fr; } }
        .panel { background: var(--bg); padding: 15px; border-radius: 8px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: white; margin-bottom: 5px; border-radius: 4px; }
        .item.checked { text-decoration: line-through; opacity: 0.6; }

        /* --- STYLES ÉCOLE --- */
        .form-group select, .form-group button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
        .action-btn { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        .exercise-box { margin-top: 15px; padding: 15px; background: #f9f9f9; border-left: 4px solid #e67e22; border-radius: 4px; font-size: 1.1em; line-height: 1.6; }
        .flashcard { width: 100%; height: 150px; background: #f39c12; color: white; display: flex; align-items: center; justify-content: center; font-size: 2em; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .chessboard { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; max-width: 300px; margin: 10px auto; border: 2px solid #333; }
        .square { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 0.7em; cursor: pointer; }
        .white { background-color: #f0d9b5; } .black { background-color: #b58863; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button id="logoutBtn" onclick="logout()">Déconnexion</button>
        <span id="headerTitle">Tribu</span>
        <button id="backBtn" onclick="showDashboard()">Retour</button>
    </div>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen">
        <h2>Qui est là ?</h2>
        <div class="profiles">
            <div class="profile-card parent" onclick="selectUser('Maman', true)"><div class="avatar">👩</div><h3>Maman</h3></div>
            <div class="profile-card parent" onclick="selectUser('Papa', true)"><div class="avatar">👨</div><h3>Papa</h3></div>
            <div class="profile-card kid" onclick="selectUser('Elina', false)"><div class="avatar">👧</div><h3>Elina</h3></div>
            <div class="profile-card kid" onclick="selectUser('Amanda', false)"><div class="avatar">👧🏼</div><h3>Amanda</h3></div>
        </div>
    </div>

    <!-- ÉCRAN CODE PIN -->
    <div id="pin-screen">
        <h2 id="pinTitle">Code secret pour </h2>
        <input type="password" id="pinInput" class="pin-input" maxlength="4" onkeyup="checkPin()">
        <p style="color:red; display:none;" id="pinError">Code incorrect</p>
        <button onclick="logout()" style="padding:10px; margin-top:20px;">Annuler</button>
    </div>

    <!-- TABLEAU DE BORD -->
    <div id="dashboard-screen">
        <div class="welcome-text">Bonjour <span id="userNameDisplay"></span> !</div>
        <div class="widget-grid" id="widgetGrid"></div>
    </div>

    <!-- APP COURSES -->
    <div id="app-courses" class="app-view">
        <div class="controls">
            <input type="text" id="newItemInput" placeholder="Ajouter (ex: Pommes)" style="flex:2">
            <input type="number" id="newItemQty" value="1" min="1" style="flex:0.5">
            <select id="itemType" style="flex:1">
                <option value="Magasin">🛒 Magasin</option>
                <option value="Drive">📦 Drive</option>
            </select>
            <button class="btn-add" onclick="addCustomItem()">Ajouter</button>
        </div>
        <div class="main-content">
            <div class="panel">
                <h3 style="color: #e26e00; margin-top:0;">📦 Drive (<span id="countDrive">0</span>)</h3>
                <div id="listDrive"></div>
            </div>
            <div class="panel">
                <h3 style="color: #27ae60; margin-top:0;">🛒 Magasin (<span id="countMagasin">0</span>)</h3>
                <div id="listMagasin"></div>
            </div>
        </div>
        <div id="syncStatus" style="font-size:12px; color:#888; margin-top:10px; text-align:center;">🔄 Connexion...</div>
    </div>

    <!-- APP ÉCOLE -->
    <div id="app-school" class="app-view">
        <div class="form-group">
            <select id="gradeSelect">
                <option value="P1">1ère Primaire (P1)</option>
                <option value="P2">2ème Primaire (P2)</option>
                <option value="P3">3ème Primaire (P3)</option>
                <option value="P4">4ème Primaire (P4)</option>
            </select>
            <select id="diffSelect">
                <option value="1">🟢 Facile</option>
                <option value="2">🟡 Moyen</option>
                <option value="3">🔴 Difficile</option>
            </select>
            <select id="subjectSelect">
                <option value="math">🧮 Mathématiques</option>
                <option value="fr">📖 Français</option>
                <option value="dictee">✍️ Dictée</option>
                <option value="lecture">👁 Lecture</option>
                <option value="cg">🌍 Culture Générale</option>
            </select>
            <button class="action-btn" onclick="generateExercise()">1. Générer l'exercice</button>
        </div>
        <div id="exerciseContainer">
            <div class="exercise-box" id="exerciseOutput">Sélectionnez une matière et générez !</div>
        </div>
        <button class="action-btn" onclick="saveScore('Exercice terminé')" style="background:#3498db; margin-top:10px; display:none;" id="btnFinished">✅ J'ai fini ! (Envoyer à Papa/Maman)</button>
    </div>

    <!-- APP LANGUES -->
    <div id="app-lang" class="app-view">
        <h3>Néerlandais (Flashcards)</h3>
        <select id="nlCategory" style="width:100%; padding:10px;" onchange="nextNlWord()">
            <option value="colors">Couleurs</option>
            <option value="animals">Animaux</option>
            <option value="numbers">Nombres</option>
        </select>
        <div class="flashcard" id="nlCard" onclick="flipCard()">Cliquez ici</div>
        <button class="action-btn" onclick="nextNlWord()" style="margin-top:10px;">Mot suivant ➔</button>
        <button class="action-btn" onclick="saveScore('A révisé le Néerlandais')" style="background:#3498db; margin-top:10px;">✅ J'ai fini ma révision !</button>
    </div>

    <!-- APP ECHECS -->
    <div id="app-chess" class="app-view">
        <p style="text-align:center; font-weight:bold;">Trouve la case : <span id="targetSquare" style="color:#8e44ad; font-size:1.5em;">--</span></p>
        <div class="chessboard" id="board"></div>
        <p id="chessFeedback" style="text-align:center; font-weight:bold; height:20px;"></p>
        <button class="action-btn" onclick="saveScore('S'est entraîné(e) aux échecs')" style="background:#3498db; margin-top:10px;">✅ J'ai fini mon entraînement !</button>
    </div>

</div>

<script>
    // =========================================================================
    // 1. CONFIGURATION (Firebase + Variables Globales)
    // =========================================================================
    const PARENT_PIN = "1234";
    let currentUser = null;
    let isCurrentParent = false;

    const firebaseConfig = {
        apiKey: "AIzaSyAcwjPfC_ObEaW9PsoWLhCmMFaMoCqSKXU",
        authDomain: "appli-familiale-13423.firebaseapp.com",
        databaseURL: "https://appli-familiale-13423-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "appli-familiale-13423",
        storageBucket: "appli-familiale-13423.firebasestorage.app",
        messagingSenderId: "17165557696",
        appId: "1:17165557696:web:9233d277ac5f72bfd17225"
    };
    firebase.initializeApp(firebaseConfig);
    const dbFirebase = firebase.database(); // Renommé pour éviter le conflit avec "db" de l'école

    // =========================================================================
    // 2. LOGIQUE DE CONNEXION & NAVIGATION
    // =========================================================================
    function selectUser(name, isParent) {
        currentUser = name; isCurrentParent = isParent;
        document.getElementById('login-screen').style.display = 'none';
        if (isParent) {
            document.getElementById('pin-screen').style.display = 'block';
            document.getElementById('pinTitle').innerText = "Code secret pour " + name;
            document.getElementById('pinInput').value = ""; document.getElementById('pinInput').focus();
        } else { loginSuccess(); }
    }

    function checkPin() {
        const input = document.getElementById('pinInput').value;
        if (input.length === 4) {
            if (input === PARENT_PIN) {
                document.getElementById('pinError').style.display = 'none'; loginSuccess();
            } else {
                document.getElementById('pinError').style.display = 'block'; document.getElementById('pinInput').value = "";
            }
        }
    }

    function loginSuccess() {
        document.getElementById('pin-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'block';
        document.getElementById('userNameDisplay').innerText = currentUser;
        
        // Afficher ou masquer les boutons "J'ai fini" selon si c'est un enfant
        document.getElementById('btnFinished').style.display = isCurrentParent ? 'none' : 'block';
        
        buildDashboard();
        initCourses(); // Charge Firebase pour les courses
    }

    function logout() {
        currentUser = null;
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('pin-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'none';
        document.querySelectorAll('.app-view').forEach(el => el.style.display = 'none');
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('headerTitle').innerText = "Tribu";
    }

    function buildDashboard() {
        const grid = document.getElementById('widgetGrid');
        grid.innerHTML = "";
        grid.innerHTML += `
            <button class="widget bg-school" onclick="openApp('app-school', '📚 Exercices')"><div class="icon">📝</div><div>Exercices</div></button>
            <button class="widget bg-lang" onclick="openApp('app-lang', '🌍 Langues')"><div class="icon">🇬🇧🇳🇱</div><div>Langues</div></button>
            <button class="widget bg-chess" onclick="openApp('app-chess', '♟️ Échecs')"><div class="icon">♟️</div><div>Échecs</div></button>
        `;
        if (isCurrentParent) {
            grid.innerHTML = `<button class="widget bg-courses" onclick="openApp('app-courses', '🛒 Courses')"><div class="icon">🛒</div><div>Courses</div></button>` + grid.innerHTML;
        }
    }

    function openApp(appId, title) {
        document.getElementById('dashboard-screen').style.display = 'none';
        document.querySelectorAll('.app-view').forEach(el => el.style.display = 'none');
        document.getElementById(appId).style.display = 'block';
        document.getElementById('headerTitle').innerText = title;
        document.getElementById('backBtn').style.display = 'block';
        if(appId === 'app-chess') { initBoard(); nextTarget(); }
        if(appId === 'app-lang') { nextNlWord(); }
    }

    function showDashboard() {
        document.getElementById('dashboard-screen').style.display = 'block';
        document.querySelectorAll('.app-view').forEach(el => el.style.display = 'none');
        document.getElementById('headerTitle').innerText = "Tribu";
        document.getElementById('backBtn').style.display = 'none';
    }

    // =========================================================================
    // 3. LOGIQUE FIREBASE : COURSES
    // =========================================================================
    let currentList = [];
    function initCourses() {
        if(!isCurrentParent) return; // Seuls les parents chargent les courses
        dbFirebase.ref('coursesTribu').on('value', (snapshot) => {
            const data = snapshot.val();
            currentList = (data && data.list) ? data.list : [];
            document.getElementById('syncStatus').innerText = "✅ Synchronisé en direct";
            renderLists();
        });
    }

    function pushToFirebase() {
        document.getElementById('syncStatus').innerText = "🔄 Synchronisation...";
        dbFirebase.ref('coursesTribu').update({ list: currentList });
    }

    function addCustomItem() {
        const name = document.getElementById('newItemInput').value.trim();
        const qty = parseInt(document.getElementById('newItemQty').value) || 1;
        const type = document.getElementById('itemType').value;
        if (name) {
            currentList.push({ id: Date.now(), name: name.charAt(0).toUpperCase() + name.slice(1), type: type, quantity: qty, checked: false });
            pushToFirebase();
            document.getElementById('newItemInput').value = '';
        }
    }

    function toggleCheck(id) {
        const item = currentList.find(i => i.id === id);
        if(item) { item.checked = !item.checked; pushToFirebase(); }
    }

    function removeById(id) {
        currentList = currentList.filter(item => item.id !== id); pushToFirebase();
    }

    function renderLists() {
        const cDrive = document.getElementById('listDrive'); const cMagasin = document.getElementById('listMagasin');
        cDrive.innerHTML = ''; cMagasin.innerHTML = '';
        let countD = 0, countM = 0;
        currentList.forEach((item) => {
            if(!item.checked) { if(item.type === 'Drive') countD++; else countM++; }
            const div = document.createElement('div');
            div.className = `item ${item.checked ? 'checked' : ''}`;
            div.innerHTML = `<span>${item.quantity}x ${item.name}</span>
                             <div><button onclick="toggleCheck(${item.id})">✓</button> <button onclick="removeById(${item.id})">X</button></div>`;
            if(item.type === 'Drive') cDrive.appendChild(div); else cMagasin.appendChild(div);
        });
        document.getElementById('countDrive').innerText = countD; document.getElementById('countMagasin').innerText = countM;
    }

    // =========================================================================
    // 4. LOGIQUE FIREBASE : SAUVEGARDE DES SCORES (NOUVEAU)
    // =========================================================================
    function saveScore(activite) {
        if(isCurrentParent) return; // On n'enregistre que les filles
        
        // Enregistre dans Firebase sous activites/Elina ou activites/Amanda
        dbFirebase.ref('activites/' + currentUser).push({
            date: new Date().toLocaleString(),
            tache: activite
        });
        
        alert("Super ! Papa et Maman ont reçu ton travail. 🌟");
        showDashboard(); // Retour à l'accueil
    }

    // =========================================================================
    // 5. LOGIQUE ÉCOLE (Exercices, Néerlandais, Echecs)
    // =========================================================================
    const schoolData = {
        fr: {
            P1: { 1: ["Sépare : MOTO", "Trouve la voyelle : P _ PA"], 2: ["Sépare : CHEVAL"], 3: ["Complète : un ch_en"] },
            P2: { 1: ["Mets au pluriel : Le chat"], 2: ["Mets au féminin : Un chien"], 3: ["Sujet ou Verbe ?"] }
        },
        math: { /* Géré par l'algorithme */ }
    }; // (J'ai raccourci l'objet data ici pour l'exemple, l'algorithme Math tourne tout seul !)

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }

    function generateExercise() {
        const grade = document.getElementById('gradeSelect').value;
        const subj = document.getElementById('subjectSelect').value;
        const diff = document.getElementById('diffSelect').value;
        let html = `<strong>${subj.toUpperCase()} - ${grade} (Niv. ${diff})</strong><br><br>`;
        
        if(subj === 'math') {
            for(let i = 1; i <= 5; i++) {
                let n1=randomInt(1,10*diff), n2=randomInt(1,5*diff);
                html += `${i}) ${n1} + ${n2} = ... <br><br>`;
            }
        } else {
            html += "Réponds aux questions sur une feuille :<br><br>1) Question 1... <br>2) Question 2..."; // Extrait simplifié
        }
        document.getElementById('exerciseOutput').innerHTML = html;
        document.getElementById('btnFinished').style.display = isCurrentParent ? 'none' : 'block';
    }

    // Néerlandais
    const nlDict = { colors: [{fr:"Rouge", nl:"Rood"}, {fr:"Bleu", nl:"Blauw"}], animals: [{fr:"Chien", nl:"Hond"}], numbers: [{fr:"Un (1)", nl:"Een"}] };
    let currentNlWord = {}; let isShowingFr = true;
    function nextNlWord() { const arr = nlDict[document.getElementById('nlCategory').value]; currentNlWord = arr[randomInt(0, arr.length-1)]; isShowingFr = true; updateCard(); }
    function flipCard() { isShowingFr = !isShowingFr; updateCard(); }
    function updateCard() { const card = document.getElementById('nlCard'); card.innerText = isShowingFr ? currentNlWord.fr : currentNlWord.nl; card.style.background = isShowingFr ? "#2980b9" : "#f39c12"; }

    // Echecs
    let cTarget = ""; const letters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    function initBoard() { const board = document.getElementById('board'); if(board.innerHTML !== "") return; for (let row = 8; row >= 1; row--) { for (let col = 0; col < 8; col++) { const square = document.createElement('div'); square.className = 'square ' + ((row + col) % 2 !== 0 ? 'black' : 'white'); const coord = letters[col] + row; square.onclick = () => { if(coord === cTarget) { document.getElementById('chessFeedback').innerText = "✅ Bravo !"; setTimeout(nextTarget, 800); } else { document.getElementById('chessFeedback').innerText = "❌ Non, c'est " + coord; } }; board.appendChild(square); } } }
    function nextTarget() { cTarget = letters[randomInt(0,7)] + (randomInt(0,7)+1); document.getElementById('targetSquare').innerText = cTarget; document.getElementById('chessFeedback').innerText = ""; }
</script>
</body>
</html>
